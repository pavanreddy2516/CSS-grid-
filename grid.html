<!DOCTYPE html>
<html>


    <head>
        <style>
            .container
            {
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 100px 100px 100px;
                gap: 15px;
                padding: 10px;
            }

            .container div
            {
                background-color: bisque;
            }


        </style>
    </head>


    <body>
        <div class="container">
            <div>Product 1</div>
            <div>Product 2</div>
            <div>Product 3</div>
            <div>Product 4</div>
            <div>Product 5</div>
            <div>Product 6</div>
        </div>
    </body>


</html>
